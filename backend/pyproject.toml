[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dungeon-assistant-backend"
version = "0.1.0"
description = "DungeonAssistant Backend - FastAPI + Socket.io"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-socketio>=5.10.0",
    "python-multipart>=0.0.7",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "httpx>=0.26.0",
    "supabase>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.5.0",
    "google-cloud-vision>=3.0.0",
    "aiofiles>=23.0.0",
    "fuzzywuzzy>=0.18.0",
    "google-cloud-speech>=2.0.0",
    "pydub>=0.25.1",
    "librosa>=0.10.0",
    "gunicorn>=21.2.0",
]

[tool.pylint]
max-line-length = 100
disable = [
    "C0111",  # missing-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
